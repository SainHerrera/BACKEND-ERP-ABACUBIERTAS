services:
  api:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-erpdatabase}
      - POSTGRES_USER=${POSTGRES_USER:-erpdb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-erpdev_secret_2025}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erpdb} -d ${POSTGRES_DB:-erpdatabase}"]
      interval: 3s
      timeout: 5s
      retries: 15

volumes:
  postgres_data: